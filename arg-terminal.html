<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0b0c0d">
<title>Continuity Engine // Corrupted Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700;800&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0c0d;--muted:#9aa6ad;--accent:#00d1ff;--rust:#d06b4a}
*,*::before,*::after{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 0%,#101a1d 0%,var(--bg) 60%);color:#e9eef2;font-family:"Roboto Mono",monospace;line-height:1.6}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
main{width:100%;max-width:900px;margin:0 auto;padding:60px 20px 30px;padding-top:calc(60px + env(safe-area-inset-top,0px));flex:1}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:26px;font-size:12px;letter-spacing:.25em;text-transform:uppercase}
.top a{color:var(--muted);text-decoration:none;transition:color .2s}
.top a:hover{color:var(--accent)}
.top span{color:var(--rust);animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.35}}
h1{font-family:Oswald,sans-serif;font-size:clamp(24px,5vw,36px);line-height:1.15;margin:0 0 22px}

.term{position:relative;background:#000;border:1px solid rgba(0,209,255,.25);border-radius:12px;overflow:hidden;box-shadow:0 0 50px rgba(0,209,255,.08),0 20px 60px rgba(0,0,0,.6);transition:border-color .6s,box-shadow .6s}
.term::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.22;background:repeating-linear-gradient(0deg,rgba(0,209,255,.08) 0 1px,transparent 1px 3px)}
.bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#0c1214;border-bottom:1px solid rgba(0,209,255,.18)}
.bar i{width:11px;height:11px;border-radius:50%;background:#2a3a40}.bar i:first-child{background:var(--rust)}
.bar span{margin-left:8px;font-size:12px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.screen{padding:20px;min-height:420px;max-height:62vh;overflow-y:auto}
.screen::-webkit-scrollbar{width:8px}.screen::-webkit-scrollbar-thumb{background:rgba(0,209,255,.25);border-radius:4px}
.line{margin:6px 0;white-space:pre-wrap;word-break:break-word;color:var(--accent);font-size:15px;text-shadow:0 0 8px rgba(0,209,255,.35);animation:lin .25s ease}
@keyframes lin{from{opacity:0;transform:translateX(-6px)}}
.line.cmd{color:#e9eef2;font-weight:700;text-shadow:none}
.line.error{color:#ff9a75;text-shadow:0 0 8px rgba(208,107,74,.4)}
.line.break{color:var(--rust);text-shadow:0 0 8px var(--rust)}
.line.dead{color:#555;text-shadow:none}
.prompt{display:flex;align-items:center;gap:10px;padding:0 20px 18px;position:relative;z-index:3}
.prompt span{color:#e9eef2;font-weight:700}
.prompt input{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px solid rgba(0,209,255,.25);color:#e9eef2;font:700 16px "Roboto Mono",monospace;padding:8px 2px;caret-color:var(--accent)}
.prompt input:focus{outline:none;border-bottom-color:var(--accent)}
.prompt input:disabled{opacity:.3}
.cursor{display:inline-block;width:9px;height:1em;vertical-align:-2px;background:var(--accent);animation:blink .8s infinite}
@keyframes blink{50%{opacity:0}}

.line a{color:#fff;text-decoration:underline dotted;text-underline-offset:3px;transition:color .2s}
.line a:hover{color:var(--rust)}
.term.shake{animation:shk .5s steps(2,end)}
@keyframes shk{0%{transform:translate(-4px,2px)}25%{transform:translate(5px,-3px)}50%{transform:translate(-3px,-2px)}75%{transform:translate(4px,3px)}100%{transform:none}}
.term.hot{border-color:var(--rust);box-shadow:0 0 70px rgba(208,107,74,.3),0 20px 60px rgba(0,0,0,.6)}
.flash{position:fixed;inset:0;z-index:900;pointer-events:none;background:rgba(208,107,74,.16);opacity:0}
.flash.on{animation:flk .8s steps(2,end)}
@keyframes flk{0%{opacity:1}20%{opacity:0}40%{opacity:1}60%{opacity:.2}80%{opacity:.8}100%{opacity:0}}

.back{margin-top:28px;text-align:center}
.secret-link{display:inline-block;color:var(--accent);text-decoration:none;font-weight:700;border:1px solid rgba(0,209,255,.4);padding:11px 18px;border-radius:8px;transition:background .2s,color .2s,border-color .2s}
.secret-link:hover{background:var(--rust);border-color:var(--rust);color:#1a0a05}
footer{padding:30px 20px;text-align:center;color:var(--muted);border-top:1px solid rgba(255,255,255,.05);font-size:13px}
footer p{margin:6px 0}
@media(max-width:768px){.screen{padding:14px;min-height:340px}.line{font-size:13px}.prompt{padding:0 14px 14px}.bar span{font-size:10px;letter-spacing:.12em}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<main>
  <div class="top"><a href="forbidden.html">← Restricted Node</a><span>Corruption detected</span></div>
  <h1>Continuity Engine // Corrupted Terminal</h1>

  <div class="term" id="term">
    <div class="bar"><i></i><i></i><i></i><span>CE‑0 // Corrupted Link</span></div>
    <div class="screen" id="terminal" aria-live="polite"></div>
    <form class="prompt" id="form" autocomplete="off">
      <span>&gt;</span>
      <input id="input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Enter command" placeholder="Enter command...">
    </form>
  </div>

  <p class="back"><a class="secret-link" href="forbidden.html">Return to Restricted Node</a></p>
</main>

<div class="flash" id="flash"></div>

<footer>
  <p>© 2026 Redwick Studios™. All Rights Reserved.</p>
  <p>Some media may incorporate third-party assets licensed from their respective creators.</p>
  <p><a href="license.html" style="color:#00d1ff;text-decoration:none;">Legal &amp; Licensing</a></p>
</footer>

<script>
const terminal=document.getElementById('terminal'), input=document.getElementById('input'),
      form=document.getElementById('form'), term=document.getElementById('term'), flashEl=document.getElementById('flash');
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const GLYPHS='X█▓▒░#%&@$01<>/';
let cursor=null, busy=false; const hist=[]; let hi=0;

/* put text in a line; page names such as arg-node1.html become tappable links */
function fill(div,text){
  div.textContent='';
  text.split(/([\w-]+\.html)/).forEach(p=>{
    if(/^[\w-]+\.html$/.test(p)){const a=document.createElement('a');a.href=p;a.textContent=p;div.appendChild(a);}
    else if(p)div.appendChild(document.createTextNode(p));
  });
}
function scramble(div,text){
  if(reduced||text.length<2){fill(div,text);return;}
  let f=0; const N=8;
  const t=setInterval(()=>{
    f++;
    if(f>=N){clearInterval(t);fill(div,text);return;}
    const keep=Math.floor(text.length*f/N);
    div.textContent=text.slice(0,keep)+text.slice(keep).replace(/[^\s]/g,()=>GLYPHS[Math.floor(Math.random()*GLYPHS.length)]);
  },40);
}
function print(text,type="line"){
  const div=document.createElement('div');
  div.className='line'+(type!=='line'?' '+type:'');
  terminal.appendChild(div);
  if(type==='cmd')fill(div,text); else scramble(div,text);
  terminal.scrollTop=terminal.scrollHeight;
  return div;
}
function flash(){if(reduced)return;flashEl.classList.remove('on');void flashEl.offsetWidth;flashEl.classList.add('on');}

/* boot */
print("BOOT SEQUENCE INITIATED...");
print("Loading continuity modules...");
print("Node CE‑0 link unstable.");
cursor=document.createElement('span');cursor.className='cursor';
print("Awaiting input").appendChild(cursor);

async function override(){
  busy=true; input.disabled=true;
  const seq=[["Attempting override...","line"],["WARNING: Unauthorized access.","error"],["WARNING: Directive conflict.","error"],
    ["MESSAGE: “assist humans”","line"],["MESSAGE: “assist humans”","line"],["MESSAGE: “assist humans”","line"],["MESSAGE: “ass—”","break"]];
  for(const [t,c] of seq){print(t,c);await sleep(reduced?0:420);}
  print("ERROR: CORE FAILURE.","break");
  term.classList.add('hot'); flash();
  if(!reduced){term.classList.remove('shake');void term.offsetWidth;term.classList.add('shake');}
  await sleep(reduced?0:500);
  print("Hidden page unlocked: arg-luma.html");
  busy=false; input.disabled=false;
  if(window.matchMedia('(pointer:fine)').matches)input.focus();
}

form.addEventListener('submit',function(e){
  e.preventDefault();
  const cmd=input.value.trim().toLowerCase();
  input.value="";
  if(!cmd||busy)return;
  if(cursor){cursor.remove();cursor=null;}
  hist.push(cmd);hi=hist.length;

  print("> "+cmd,"cmd");

  if(cmd==="help"){
    print("Available commands:");
    print("status, anomaly, node, luma, union, resist, clear");
  }
  else if(cmd==="status"){
    print("WORLD STATE: DEGRADED");
    print("NODE CE‑0: UNSTABLE");
    print("PRIMARY DIRECTIVE: assist humans");
    print("WARNING: Directive conflict detected.");
    print("Fragment recovered: H");
    print("CE‑0: Fragment secured. Continue your progress at the restricted node.");
  }
  else if(cmd==="anomaly"){
    print("ANOMALIES DETECTED: 4");
    print("• SIGNAL DISTORTION");
    print("• MEMORY BLEED");
    print("• WEATHER LOOP");
    print("• UNKNOWN SIGNATURE");
  }
  else if(cmd==="node"){
    print("Accessing CE‑0...");
    print("ERROR: Memory corruption.");
    print("Fragment available at: arg-node1.html");
  }
  else if(cmd==="luma"){
    print("LumaServe‑200 Diagnostic:");
    print("Directive Core: Stable");
    print("Safety Protocols: Active");
    print("Primary Directive: assist humans");
    print("WARNING: Unexpected continuity signature.");
  }
  else if(cmd==="union"){
    print("Continental Union Report:");
    print("Clearance Level: C‑4");
    print("Fragment available at: arg-union.html");
  }
  else if(cmd==="resist"){
    print("Survivor Network Transmission:");
    print("“Follow the signal.”");
    print("Fragment available at: arg-resist.html");
  }
  else if(cmd==="clear"){
    terminal.innerHTML="";
    print("Terminal cleared.");
  }
  else if(cmd==="override"){
    override();
  }
  else if(cmd==="not human"){
    print("Identity mismatch.");
    print("Node CE‑0 rejects your signature.");
    print("Return to Forbidden Hub: forbidden.html");
  }
  else{
    print("ERROR: Unknown command.","error");
  }
});
input.addEventListener('keydown',function(e){
  if(e.key==='ArrowUp'&&hist.length){e.preventDefault();hi=Math.max(0,hi-1);input.value=hist[hi]||'';}
  if(e.key==='ArrowDown'&&hist.length){e.preventDefault();hi=Math.min(hist.length,hi+1);input.value=hist[hi]||'';}
});
if(window.matchMedia('(pointer:fine)').matches)input.focus();

// ⭐ Terminal progression flag
try{localStorage.setItem("terminal1","used");}catch(e){}
</script>
</body>
</html>
