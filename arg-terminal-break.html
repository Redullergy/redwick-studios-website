<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Continuity Engine // Terminal Failure</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
body{margin:0;background:#0b0c0d;color:#e9eef2;font-family:Roboto Mono, monospace}
main{max-width:900px;margin:0 auto;padding:100px 20px}

.terminal{
  background:#000;
  padding:20px;
  border-radius:10px;
  border:1px solid #00d1ff33;
  box-shadow:0 0 40px #00d1ff11 inset;
  min-height:500px;
  overflow-y:auto;
}

.line{margin:6px 0;white-space:pre-wrap;color:#00d1ff}
.error{color:#d06b4a}
.break{color:#d06b4a;text-shadow:0 0 6px #d06b4a}
.dead{color:#444;text-shadow:none}

input{
  width:100%;
  background:#0b0c0d;
  border:1px solid #00d1ff55;
  padding:10px;
  color:#e9eef2;
  font-family:Roboto Mono;
  border-radius:6px;
  margin-top:20px;
}

.cursor{
  display:inline-block;
  width:10px;
  background:#00d1ff;
  animation:blink 0.8s infinite;
}
@keyframes blink{0%{opacity:1}50%{opacity:0}100%{opacity:1}}

.secret-link{
  color:#00d1ff;
  text-decoration:none;
  font-weight:bold;
}
.secret-link:hover{
  color:#d06b4a;
}
</style>
</head>

<body>

<main>
  <h1 style="font-size:28px;">Continuity Engine // Terminal Failure</h1>

  <div class="terminal" id="terminal">
    <div class="line">BOOT SEQUENCE INITIATED...</div>
    <div class="line">Loading continuity modules...</div>
    <div class="line">Node CE‑0 link unstable.</div>
    <div class="line">Awaiting input<span class="cursor"></span></div>
  </div>

  <input id="input" placeholder="Enter command...">

  <!-- ⭐ RETURN LINK ALWAYS VISIBLE ⭐ -->
  <p style="margin-top:30px;text-align:center;">
    <a class="secret-link" href="forbidden.html">Return to Restricted Node</a>
  </p>
</main>

<script>
const terminal = document.getElementById('terminal');
const input = document.getElementById('input');

let integrity = 100; // Terminal health

function print(text, type="line"){
  const div = document.createElement('div');
  div.className = type;
  div.textContent = text;
  terminal.appendChild(div);
  terminal.scrollTop = terminal.scrollHeight;
}

function degrade(){
  integrity -= Math.floor(Math.random() * 15) + 5;

  if(integrity < 70 && integrity > 40){
    print("SYSTEM WARNING: Integrity falling.", "error");
  }

  if(integrity <= 40 && integrity > 10){
    print("ERROR: Memory corruption spreading.", "break");
    print("Memory shard detected: O");
    print("CE‑0: Fragment secured. Continue your progress at the restricted node.");
  }

  if(integrity <= 10 && integrity > 0){
    print("CRITICAL FAILURE: Directive conflict.", "break");
  }

  if(integrity <= 0){
    terminal.innerHTML = "";
    print("TERMINAL OFFLINE.", "dead");
    print("CE‑0 CORE FAILURE.", "dead");
    print("FINAL MESSAGE: assist humans", "dead");
    input.disabled = true;
  }
}

input.addEventListener('keydown', function(e){
  if(e.key === "Enter"){
    const cmd = input.value.trim().toLowerCase();
    input.value = "";

    if(integrity <= 0) return;

    print("> " + cmd);

    degrade();

    if(integrity <= 0) return;

    // COMMAND RESPONSES
    if(cmd === "help"){
      print("Commands: status, anomaly, node, clear");
    }

    else if(cmd === "status"){
      print("WORLD STATE: DEGRADED");
      print("NODE CE‑0: " + (integrity < 50 ? "CORRUPTED" : "UNSTABLE"));
      print("PRIMARY DIRECTIVE: assist humans");
    }

    else if(cmd === "anomaly"){
      print("ANOMALIES DETECTED: " + (integrity < 40 ? "UNKNOWN" : "4"));
      print("• SIGNAL DISTORTION");
      print("• MEMORY BLEED");
      print("• WEATHER LOOP");
      print("• ???");
    }

    else if(cmd === "node"){
      print("Accessing CE‑0...");
      print(integrity < 30 ? "ERROR: Node unreachable." : "Node fragment available.");
    }

    else if(cmd === "clear"){
      terminal.innerHTML = "";
      print("Terminal cleared.");
    }

    else{
      print("ERROR: Unknown command.", "error");
    }
  }
});

// ⭐ Terminal progression flag
localStorage.setItem("terminal2", "used");
</script>

</body>
</html>
