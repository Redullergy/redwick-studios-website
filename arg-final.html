<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Final Sequence // CE‑07</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
body{margin:0;background:#000;color:#e9eef2;font-family:Roboto Mono, monospace;text-align:center}
main{max-width:900px;margin:0 auto;padding:120px 20px}

input{
  width:100%;
  max-width:400px;
  background:#0b0c0d;
  border:1px solid #00d1ff55;
  padding:10px;
  color:#e9eef2;
  font-family:Roboto Mono;
  border-radius:6px;
  margin-top:20px;
}

.big-word{
  font-size:120px;
  font-weight:700;
  color:#00d1ff;
  opacity:0;
  transition:opacity 1s ease;
  margin-top:80px;
}

.timer{
  font-size:40px;
  margin-top:40px;
  opacity:0;
  transition:opacity 1s ease;
}

.hidden{display:none}

#translated,
#finalLore{
    opacity:0;
    transition:opacity 1s ease;
}
</style>
</head>

<body>

<main>
  <h1>FINAL INPUT REQUIRED</h1>
  <p>Combine the clues from all three terminals.</p>
  <p>Enter the final word to unlock the sequence.</p>

  <input id="finalInput" placeholder="Enter final word...">

  <div id="bigWord" class="big-word hidden">THE WORLD WAS DYING</div>

<div id="translated" class="big-word hidden" style="font-size:70px;color:#ffffff;">
HUMANITY WOULD NOT CHANGE
</div>

<div id="finalLore" class="hidden" style="margin-top:30px;font-size:24px;color:#00d1ff;">
I DID
</div>

<div id="timer" class="timer hidden">5</div>
  
</main>

<script>
const input = document.getElementById('finalInput');
const bigWord = document.getElementById('bigWord');
const timer = document.getElementById('timer');

input.addEventListener('keydown', function(e){
  if(e.key === "Enter"){
    const value = input.value.trim().toLowerCase();
    input.value = "";

    if(value === "home"){

  const translated = document.getElementById("translated");
  const finalLore = document.getElementById("finalLore");

  bigWord.classList.remove("hidden");

  setTimeout(() => {
    bigWord.style.opacity = 1;
  }, 50);

  setTimeout(() => {
    translated.classList.remove("hidden");
    translated.style.opacity = 1;
  }, 2500);

  setTimeout(() => {
  finalLore.classList.remove("hidden");
  finalLore.style.opacity = 1;
}, 4500);

  setTimeout(() => {

    timer.classList.remove("hidden");
    timer.style.opacity = 1;

    let count = 5;

    const interval = setInterval(() => {
      count--;
      timer.textContent = count;

      if(count === 0){
        clearInterval(interval);
        window.location.href = "index.html";
      }
    }, 1000);

    }, 6500);
    }
  }
});
</script>

</body>
</html>
